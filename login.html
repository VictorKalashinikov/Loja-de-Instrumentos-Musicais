<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>Login</title>
</head>
<body>
    <section id="login">
        <header class="header">
            <div class="logo">
                <img src="imagens/logo.png" alt="Logo Blackdoor" class="logo-img">
                <h1 class="logo-title">BLACKDOOR</h1>
            </div>
            <nav class="nav">
                <a href="index.html" class="active">INÍCIO</a>
                <a href="#">INSTRUMENTOS</a>
                <a href="#">ACESSÓRIOS</a>
                <a href="#">CONTATO</a>
                <a href="contaCriarIniciar.html">CONTA</a>
            </nav>
        </header>



        <div id="loginBox">
            <h1>Fazer Login</h1>
            <form id="form" autocomplete="on">
                <p>
                    <label for="usuario">Usuario:</label>
                    <input type="text" id="usuario" placeholder="Usuario" required autofocus autocomplete="nickname" size="35">
                </p>
                <p>
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" placeholder="Senha" required autocomplete="current-password" size="35">
                </p>
                <button type="submit"> Entrar </button>
            </form>
        </div>





    </section>
    <footer>
        <div class="logo">
            <img src="imagens/logo.png" alt="Logo Blackdoor" class="logo-img">
            <h1 class="logo-title">BLACKDOOR</h1>
        </div>
        <div>
            <h2>Institucional</h2>
        </div>
        <div>
            <h2>Formas de pagamento</h2>

            <h2>Formas de envio</h2>
        </div>
        <div>
            <h2>Atendimento</h2>
        </div>
        <div>
            <h2>Redes Sociais</h2>
        </div>

        <div class="creditos">
            <a href="https://www.flaticon.com/free-icons/pedal" title="pedal icons">
                Pedal icons created by Magnific - Flaticon
            </a>
            <a href="https://www.flaticon.com/free-icons/vip" title="vip icons">
                Vip icons created by Magnific - Flaticon
            </a>
        </div>
    </footer>
    <script src="script.js"></script>
</body>
</html>
